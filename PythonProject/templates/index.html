<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>House Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body class="bg-dark">

  <div class="container">
      <div class="row">

          <div class="card" style="width:100%; height:100%; margin-top:50px">
                <div class="card-header" style="text-align:center">
                    <h1>Welcome to House Price Predictor</h1>
                </div>

              <div class="card-body">
                    <form method="post" accept-charset="UTF-8">

                        <div class="row">
                            <div class="col-md-6 form-group" style="text-align:center">
                                <label><b>Select the Location:</b></label>
                                <select class="selectpicker form-control" id="location" name="location" required>
                                    {% for loc in location %}
                                        <option value="{{ loc }}">{{ loc }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6 form-group" style="text-align:center">
                                <label><b>Enter BHK:</b></label>
                                <input type="text" class="form-control" id="bhk" name="bhk" placeholder="Enter BHK">
                            </div>

                            <div class="col-md-6 form-group" style="text-align:center">
                                <label><b>Enter No. of Bathrooms:</b></label>
                                <input type="text" class="form-control" id="bath" name="bath" placeholder="Enter No. of Bathrooms">
                                </div>

                            <div class="col-md-6 form-group" style="text-align:center">
                                <label><b>Enter Square Feet:</b></label>
                                <input type="text" class="form-control" id="total_sqft" name="total_sqft" placeholder="Enter Total Square Feet">
                                </div>
                            <div class="col-md-12 form-group mt-3">
                                <button class="btn btn-primary form-control" onclick="send_data(event)">Predict Price</button>
                            </div>
                        </div>
                    </form>
                    <br>

                    <div class="col-md-12" style="text-align:center">
                        <h3><span id="prediction"></span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    function form_handler(event) {
        event.preventDefault();
    }

    function send_data()
    {
        document.querySelector('form').addEventListener("submit", form_handler);

        var fd=new FormData(document.querySelector('form'));

        var xhr = new XMLHttpRequest();

        xhr.open('POST', '/predict', true);
        document.getElementById("prediction").innerHTML = "Wait Predicting Price!...";
        xhr.onreadystatechange = function(){
            if(xhr.readyState == XMLHttpRequest.DONE){
                document.getElementById('prediction').innerHTML="Prediction: ₹ "+xhr.responseText;
            }
        };

        xhr.onload = function(){};
        xhr.send(fd);

    }
</script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
  </body>
</html>
